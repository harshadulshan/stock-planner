<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-label="How an order list is made: the sales history feeds one forecasting model with a measured range; today&#x27;s orders follow from each unit&#x27;s chance of selling before the next delivery (empty shelves lose sales) and one shop-wide price of money in stock, with packs, minimum order quantities, the budget and supplier minimums; purchase orders per supplier; a replay of the last weeks with a model trained only on earlier sales." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>How an order list is made</title>
<style>text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x="0.5" y="0.5" width="999" height="249" rx="14" fill="#0d1117" stroke="#30363d"/>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9 z" fill="#8b949e"/></marker></defs><rect width="0" height="0"><animate id="t" attributeName="width" from="0" to="0" dur="10.0s" begin="0s;t.end"/></rect>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0200;0.0550;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><rect x="24" y="70" width="150" height="62" rx="10" fill="#161b22" stroke="#58a6ff" stroke-opacity=".75"/><text x="36" y="92" font-size="14" font-weight="700" fill="#e6edf3">Sales history</text><text x="36" y="109" font-size="11.5" fill="#8b949e">daily sales, events,</text><text x="36" y="123" font-size="11.5" fill="#8b949e">suppliers, stock</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1000;0.1350;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><rect x="204" y="70" width="176" height="62" rx="10" fill="#161b22" stroke="#a371f7" stroke-opacity=".75"/><text x="216" y="92" font-size="14" font-weight="700" fill="#e6edf3">Forecast + range</text><text x="216" y="109" font-size="11.5" fill="#8b949e">one LightGBM model;</text><text x="216" y="123" font-size="11.5" fill="#8b949e">range from unseen weeks</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2000;0.2350;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><rect x="410" y="70" width="186" height="62" rx="10" fill="#161b22" stroke="#f0883e" stroke-opacity=".75"/><text x="422" y="92" font-size="14" font-weight="700" fill="#e6edf3">Order today</text><text x="422" y="109" font-size="11.5" fill="#8b949e">lost sales, packs, MOQ,</text><text x="422" y="123" font-size="11.5" fill="#8b949e">budget, supplier minimum</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3000;0.3350;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><rect x="626" y="70" width="160" height="62" rx="10" fill="#161b22" stroke="#3fb950" stroke-opacity=".75"/><text x="638" y="92" font-size="14" font-weight="700" fill="#e6edf3">Purchase orders</text><text x="638" y="109" font-size="11.5" fill="#8b949e">one sheet per</text><text x="638" y="123" font-size="11.5" fill="#8b949e">supplier (Excel)</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3800;0.4150;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><rect x="816" y="70" width="160" height="62" rx="10" fill="#161b22" stroke="#3fb950" stroke-opacity=".75"/><text x="828" y="92" font-size="14" font-weight="700" fill="#e6edf3">Replay</text><text x="828" y="109" font-size="11.5" fill="#8b949e">the last weeks, both</text><text x="828" y="123" font-size="11.5" fill="#8b949e">ways, real sales</text></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0800;0.1100;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><path d="M174 101 L200 101" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1800;0.2100;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><path d="M380 101 L406 101" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2800;0.3100;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><path d="M596 101 L622 101" fill="none" stroke="#8b949e" stroke-width="1.6" marker-end="url(#ah)"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3600;0.3900;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><path d="M786 101 L812 101" fill="none" stroke="#3fb950" stroke-width="1.6" marker-end="url(#ah)"/></g>
<g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4400;0.4700;0.9700;0.9701;1" dur="10.0s" begin="t.begin" fill="freeze"/><path d="M896 132 C896 200 300 200 292 136" fill="none" stroke="#3fb950" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#ah)"/><text x="500" y="196" text-anchor="middle" font-size="11.5" fill="#8b949e">the replay uses a model trained only on sales before the replayed weeks</text></g>
<text x="24" y="34" font-size="13" font-weight="700" fill="#e6edf3">How an order list is made</text><text x="24" y="232" font-size="11.5" fill="#8b949e">Every input of the forecast is at least as old as the time to the next delivery, so past weeks can be replayed without looking ahead; the latest weeks come in as a correction.</text>
</svg>
